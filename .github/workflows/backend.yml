name: Backend

on:
  push:
    paths:
      - 'backend/**'
      - 'iot/**'
      - 'deploy/**'
      - '.github/workflows/backend.yml'
      - '.github/mosquitto.conf'
      - '.gitignore'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'iot/**'
      - 'deploy/**'
      - '.github/workflows/backend.yml'
      - '.github/mosquitto.conf'
      - '.gitignore'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ocm
          POSTGRES_USER: ocm
          POSTGRES_PASSWORD: ocm
          # Wall-clock contract (backend internal/db + internal/tz): instant
          # columns are timestamptz, so their meaning never depends on the
          # session zone; the zone is pinned to the Asia/Shanghai anchor so
          # server-side rendering matches the logs.
          TZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocm -d ocm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Verify modules tidy
        run: |
          go mod tidy
          # Only diff files that exist (go.sum is absent while there are no deps).
          files="go.mod"
          [ -f go.sum ] && files="$files go.sum"
          git diff --exit-code -- $files

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # PostgreSQL index names are schema-global: a duplicate name makes the
      # later CREATE INDEX IF NOT EXISTS silently skip and the index never
      # exists (see agents/lessons.md). Enforce table-specific names here.
      - name: Index names unique (PostgreSQL schema-global)
        run: |
          dups=$(grep -rhoE 'CREATE (UNIQUE )?INDEX IF NOT EXISTS (idx_[a-z0-9_]+)' internal --include='*.go' \
            | sed -E 's/.*IF NOT EXISTS //' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::duplicate index names (schema-global in PostgreSQL): $dups"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # Contract drift gate: regenerate the OpenAPI docs and fail if they
      # differ from the committed version (someone changed handlers/models
      # without running swag init).
      # Do NOT add --parseDependency: it walks the go-list dependency tree,
      # which drags in stdlib os/user — a second package named "user" whose
      # User type collides with internal/user.User, making swag rename our
      # schema to ocm-backend_internal_user.User (see agents/lessons.md).
      - name: Swagger docs drift
        run: |
          go tool swag init -o docs --requiredByDefault
          git diff --exit-code -- docs/

      - name: Test
        run: go test -race -coverprofile=coverage.out -v ./...

      # Integration coverage for the connection layer and the wall-clock
      # contract (session anchor + timestamptz instant round trip). These tests
      # are behind the integration build tag, so the plain `go test ./...`
      # above skips them — without this step the DSN anchor could regress
      # unnoticed.
      - name: DB foundation integration tests
        run: go test -tags=integration -v ./internal/db/...
        env:
          DB_TEST_POSTGRES_DSN: 'postgres://ocm:ocm@127.0.0.1:5432/ocm?sslmode=disable'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          # Must be built with a Go >= the module's `go` directive: v2.13.0 was
          # the first release built with go1.27, and a linter built with an
          # older Go refuses to run ("the Go language version used to build
          # golangci-lint is lower than the targeted Go version").
          version: v2.15.0

      # The IoT SDK is a second Go module (iot/, module github.com/zyang4418/ocm/iot)
      # so it gets the same gate set as backend, pointed at its own directory.
      - name: IoT SDK verify modules tidy
        working-directory: iot
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: IoT SDK gofmt
        working-directory: iot
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::Files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: IoT SDK vet & build
        working-directory: iot
        run: go vet ./... && go build ./...

      - name: IoT SDK test
        working-directory: iot
        run: go test -race -coverprofile=coverage-iot.out -v ./...

      - name: IoT SDK golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: iot
          version: v2.15.0

  docker:
    name: Prod image
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ocm
          POSTGRES_USER: ocm
          POSTGRES_PASSWORD: ocm
          # Wall-clock contract (backend internal/db + internal/tz): the zone
          # is pinned to the Asia/Shanghai anchor so server-side rendering
          # matches the logs and the operators' expectations.
          TZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocm -d ocm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Build
        run: docker build -f backend/Dockerfile -t ocm-backend:ci backend/

      # Anonymous broker for the IoT data-plane e2e only (scratch tables; the
      # test drops/recreates iot_* in the ocm database). Production broker
      # bootstrap lives in deploy/mosquitto (password_file + acl_file).
      # Started as a step, not a service container: services launch before
      # checkout, so a workspace file mount cannot work there (the host path
      # does not exist yet — Docker auto-creates a directory and the file
      # mount fails with "not a directory").
      - name: IoT data-plane e2e
        working-directory: backend
        run: |
          docker run -d --name iot-mosquitto -p 1883:1883 \
            -v "$GITHUB_WORKSPACE/.github/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2.1.2-alpine
          up=""
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1883) 2>/dev/null; then up=1; break; fi
            sleep 1
          done
          if [ -z "$up" ]; then
            docker logs iot-mosquitto
            exit 1
          fi
          go test -tags=integration -v ./internal/iot/...
        env:
          IOT_TEST_MQTT_URL: tcp://127.0.0.1:1883
          IOT_TEST_POSTGRES_DSN: 'postgres://ocm:ocm@127.0.0.1:5432/ocm?sslmode=disable'

      - name: Run & readiness check
        run: |
          docker run -d --name ocm-backend-ci --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_USER=ocm \
            -e DB_PASSWORD=ocm \
            -e DB_NAME=ocm \
            -e DB_SSLMODE=disable \
            ocm-backend:ci
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/readyz; then echo; break; fi
            sleep 0.5
          done
          curl -sf http://localhost:8080/readyz | grep -q ok || { docker logs ocm-backend-ci; exit 1; }
          docker stop ocm-backend-ci

      - name: Verify non-root runtime
        run: |
          docker run --rm --entrypoint /bin/sh ocm-backend:ci -c 'id -u' | grep -q 10001
          echo "runs as non-root uid 10001"
