services:
  postgres:
    image: postgres:17-alpine
    container_name: ocm-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ocm
      - POSTGRES_USER=ocm
      - POSTGRES_PASSWORD=ocm
      # Wall-clock contract (see backend internal/db + internal/tz): instant
      # columns are timestamptz, so their meaning never depends on the session
      # zone. The zone is pinned to the Asia/Shanghai anchor anyway so that
      # psql, pg_dump and server-side now() read as Beijing wall clock,
      # matching the logs and the operators' expectations.
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ocm-backend-dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/tmp
    environment:
      - PORT=8080
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ocm
      - DB_PASSWORD=ocm
      - DB_NAME=ocm
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - WX_APP_ID=${WX_APP_ID:-}
      - WX_APP_SECRET=${WX_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: air

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    image: ocm-web:dev
    container_name: ocm-web-dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # vite dev server runs in this container; the backend is reachable by
      # its compose service name on the internal network.
      - VITE_API_PROXY_TARGET=http://backend:8080
      # Optional ICP filing number, inlined by the vite dev server.
      - VITE_ICP_NUMBER=${ICP_NUMBER:-}
      # External docs site origin; when set the in-app docs links are shown.
      - VITE_DOCS_URL=${DOCS_URL:-}
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_dev_data:
